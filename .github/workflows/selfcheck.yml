name: selfcheck

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: 离线自测（Windows / Python 3.10）
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 运行离线自测
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python AutoTyper.pyw --selftest
